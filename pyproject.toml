[project]
name = "corpusaudit"
version = "0.1.0"
description = "Agentic web-corpus auditor: pytest for web corpora (WaC-13 / EMNLP 2026)"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "huggingface-hub>=0.25",
    "pyyaml>=6.0",
    "lingua-language-detector>=2.0",
    "anthropic>=0.40",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
# Only needed to reproduce the external CHALIS calibration of the Czech selector:
# the corpus already ships these identifiers' predictions as columns.
lid = ["fasttext-numpy2-wheel", "langdetect"]

[tool.hatch.build.targets.wheel]
packages = ["src/corpusaudit"]
