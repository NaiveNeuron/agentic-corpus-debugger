    membership test.
  agent_evidence: '231 distinct domains under the ''slo.'' prefix, totaling 73,835
    of 26,470,482 documents (0.28% of documents). These documents are far longer than
    the corpus average (mean 5,060 words vs. corpus-wide mean 438 words, ~11.6x),
    so they account for a disproportionate ~3.2% of the corpus''s total word volume
    despite being 0.28% of documents. evaluate_detector (seed=6, n=12) inspected 12
    sampled documents: all 12 were fluent Slovak health/lifestyle/pet-care articles
    with Russian-transliterated URL slugs, hosted on domains whose names bear no topical
    relation to their content (a medical article at ''slo.kelinvestgroup.com'', a
    Nintendo Switch game article at ''slo.gov-civil-lisboa.pt'') -- strong evidence
    of a domain-squatting content-mirror operation rather than genuine publishers.
    minhash_cluster_size on these documents is mostly 1-6, indicating the near-duplicate
    detector only partially catches copies of the same underlying article spread across
    different mirror domains.'
