id: document_ids_unique
scope: any
status: accepted
kind: metadata_invariant
description: >-
  Document identifiers should be unique within a corpus release, since they are
  the key downstream tooling joins on. 13 identifiers occur twice in the Slovak
  FineWeb2 release, i.e. 26 rows share an id with another row. The count is negligible for training but breaks the
  assumption that an id identifies a document, and it is exactly the kind of
  integrity condition a corpus test suite should assert once and re-check on
  every release.
selector: id in (select id from meta group by id having count(*) > 1)
assertion: n_matched == 0
discovered_by: framework
found_in_runs: []
evidence:
  prevalence: 9.8e-07
  n_matched: 26
  n_evaluated: 26470482
  exact_on_full_corpus: true
  validation: arithmetic
  note: >-
    A framework-provided invariant, not an agent finding: it ships with the audit
    environment so that any corpus adapter inherits it. The selector matches rows
    whose id is shared, so it reports 26 rows for 13 duplicated ids.
  human_decision: not_required
  mechanism: >-
    Traced through the raw release rather than left unexplained. All 13 collisions
    sit in a single crawl, CC-MAIN-2024-10 (the newest of the 96), and in every
    case both rows come from the *same* WARC file, so this is not two crawls
    reusing an identifier. The two documents are not copies of each other either:
    their extracted texts differ, and in only 1 of the 13 pairs is the shorter one
    a prefix of the longer -- elsewhere they begin with different content from the
    same URL (for example one copy opens with a site-wide banner and the other
    with the product description). The evidence therefore says one record
    identifier yields two different documents within one WARC file; whether the
    duplicate arises in the crawl or in extraction cannot be settled from the
    published columns, and we do not claim which. What matters downstream is
    unaffected by that question: a join on `id` silently fans out these rows, and
    `id` is the natural key the audit environment itself joins on.
