id: firebase_webapp_doorway_spam
scope: slk_Latn
source: baseline:random
description: A recurring cluster of documents comes from randomly-named subdomains
  on firebaseapp.com and web.app (Google Firebase free hosting), containing incoherent
  text stitched from unrelated topic fragments (crypto/coinbase, personal loans, real
  estate, legal templates, driving schools, COVID forms, stock-market RNS notices).
  These read as auto-generated SEO doorway/content-farm pages rather than genuine
  authored Slovak text, and several are fully or partially in English despite being
  labeled Slovak.
selector: domain LIKE '%.firebaseapp.com' OR domain LIKE '%.web.app'
assertion: prevalence <= 0.053208
evidence:
  agent_evidence: '16 of the 300 sampled documents (~5%) match this domain pattern,
    e.g. iahkepeniazeljgh.firebaseapp.com, platubfn.firebaseapp.com, akozbohatnutllil.firebaseapp.com,
    forsaljningavaktierdrbz.web.app, pracovnemiestagcoz.firebaseapp.com, investicielqot.firebaseapp.com,
    pracovnemiestaohlt.firebaseapp.com, fastlibraryebzm.web.app, hurmanblirrikanec.firebaseapp.com,
    magadocsbeqf.web.app, investerarpengarnpkk.web.app, iahkepeniazefgbn.firebaseapp.com,
    heylibbess.web.app, stormdocsfxin.web.app, hurmanblirrikqmph.firebaseapp.com (pure
    English UBS/RNS announcement, fasttext/langdetect/lingua_top all = en yet language=slk),
    investeringarjbdc.web.app. In every sampled case the text jumps between unrelated
    subjects mid-document, consistent with scraped/concatenated snippets rather than
    genuine prose. Counter-evidence: none of the 16 examples in the sample look like
    legitimate content, so within-sample precision is high, though the domain pattern
    could in principle catch a genuine small business site hosted on Firebase''s free
    tier.'
  prevalence: 0.053207833540771944
  prevalence_ci95:
  - 0.05312239361012374
  - 0.05329340315523455
  n_matched: 1408437
  evaluated_on: meta
  exact_on_full_corpus: true
  agent_expected_precision: 0.85
  likely_false_positives: A small legitimate personal or hobby site genuinely hosted
    on Firebase's free tier would be wrongly included; also pages that are template-heavy
    but topically coherent (e.g. a single legal-form generator) could be swept in
    even though they are not multi-topic spam.
