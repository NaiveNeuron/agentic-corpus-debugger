id: incoherent_spun_affiliate_content
scope: slk_Latn
source: baseline:random
description: A set of documents on loan/casino/betting affiliate sites contain fluent-at-the-sentence-level
  Slovak that is nevertheless topically incoherent across the document — unrelated
  sentences (tourism facts, sports trivia, legal notices) are stitched next to gambling/loan
  promotional copy with no topical continuity, indicating spun or automatically assembled
  SEO content rather than genuine authored text. Unlike the doorway-domain cluster,
  these pass language identification cleanly because each sentence is well-formed
  Slovak.
selector: domain IN ('terrapermonia.sk','blueplast.sk','prachova.sk','ufophoenix.xyz','dailyufosightings.xyz','lubicon.cz','obecweb.sk')
assertion: prevalence <= 0.000344
evidence:
  agent_evidence: terrapermonia.sk ('okamzita pozicka piestany') juxtaposes 'Vďaka
    jej unikátnym, nedotknutým prírodným krásam, bola vyhlásená za národnú pamiatku'
    (tourism) directly with 'ide o DOXXbet no deposit bonus' (gambling) and unrelated
    cycling-route text. obecweb.sk mixes World Cup match odds with an unrelated sentence
    about Tallinn's prettiest alley. blueplast.sk mixes a football joke, a train-line
    renovation notice, and payday-loan copy in adjacent sentences. All are labeled
    slk with high language_score/fasttext=sk since individual sentences are fluent.
