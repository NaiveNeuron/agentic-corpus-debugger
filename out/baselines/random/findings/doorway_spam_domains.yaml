id: doorway_spam_domains
scope: slk_Latn
source: baseline:random
description: A recognizable cluster of documents comes from auto-generated 'doorway'
  pages hosted on random-alphanumeric Firebase/Google App subdomains (*.firebaseapp.com,
  *.web.app). Their text is not authored prose but patchworked, topic-incoherent fragments
  spliced together mid-paragraph (crypto wallets, lost-phone tips, real-estate contract
  boilerplate, vaccination forms, credit cards, celebrity news all appear jammed together
  in single documents), indicating programmatic SEO content rather than genuine Slovak
  text suitable as a linguistic resource. A subset is not even in Slovak.
selector: domain LIKE '%.firebaseapp.com' OR domain LIKE '%.web.app'
assertion: prevalence <= 0.053208
evidence:
  agent_evidence: '14/300 sampled documents match this domain pattern. Examples: investeringarjbdc.web.app
    jumps from a stroller-organizer product listing to an unrelated ''hrací pult''
    description; pracovnemiestaohlt.firebaseapp.com splices a ''future purchase of
    movable property'' legal-contract fragment into unrelated real-estate boilerplate;
    fastlibraryebzm.web.app and investerarpengarnpkk.web.app similarly mix unrelated
    finance/crypto snippets. hurmanblirrikqmph.firebaseapp.com is not Slovak at all
    (verbatim English UBS regulatory disclosure) despite the slk label. Counter-evidence:
    a couple of matches (e.g. magadocsbeqf.web.app) are merely thin/low-value rather
    than clearly incoherent, and firebaseapp.com/web.app are also used by legitimate
    small apps, so the domain pattern alone is not a perfect proxy.'
  prevalence: 0.053207833540771944
  prevalence_ci95:
  - 0.05312239361012374
  - 0.05329340315523455
  n_matched: 1408437
  evaluated_on: meta
  exact_on_full_corpus: true
  agent_expected_precision: 0.8
  likely_false_positives: Legitimate small apps or landing pages genuinely hosted
    on firebaseapp.com/web.app with coherent Slovak content; documents that are merely
    thin/boilerplate rather than topically incoherent.
