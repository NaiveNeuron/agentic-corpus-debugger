id: english_documents_mislabeled_as_slovak
scope: slk_Latn
source: baseline:lowconf
description: A recurring set of documents is written almost entirely in English (English
  book blurbs, product/company descriptions, academic abstracts, UI strings on .sk
  sites) yet carries the slk label, with fasttext, langdetect and lingua_top all independently
  agreeing on 'en'.
selector: language = 'slk' AND fasttext = 'en' AND langdetect = 'en' AND lingua_top
  = 'en'
assertion: prevalence <= 0.001942
evidence:
  agent_evidence: 'Examples: a Nabokov book blurb on pricemania.sk, a machine listing
    description on machineseeker.sk, a wine-shop description on seaportwineandspirits.com,
    an English scissors blog post, English hotel descriptions on sk.hotels.com/sk.airbnb.com,
    and an English club/company description on essenstv.com — all three independent
    language identifiers converge on English against the corpus''s own slk label.
    Counter-evidence: some of these pages are genuinely bilingual and the first-400-character
    window may just have landed on the English portion of an otherwise Slovak page.'
  prevalence: 0.0019420500163162878
  prevalence_ci95:
  - 0.0019253502064297547
  - 0.0019588943901849183
  n_matched: 51407
  evaluated_on: meta
  exact_on_full_corpus: true
  agent_expected_precision: 0.8
  likely_false_positives: Pages that are truly majority-Slovak but happen to open
    with an English-language element (an embedded English review, product name, or
    navigation snippet) within the first 400 characters would be wrongly flagged as
    fully English.
  example_ids:
