id: programmatic_doorway_spam_pages
scope: slk_Latn
source: baseline:lowconf
description: A large fraction of the sample consists of machine-generated 'doorway'
  pages on randomly-named Firebase-hosted subdomains (e.g. *.firebaseapp.com, *.web.app,
  with paths like /NNNNN/NNNNN.html) that splice together unrelated boilerplate sentences
  (currency converters, crypto-exchange blurbs, random trivia, e-commerce snippets)
  rather than containing coherent human-authored Slovak prose.
selector: domain LIKE '%.firebaseapp.com' OR domain LIKE '%.web.app'
assertion: prevalence <= 0.053208
evidence:
  agent_evidence: 'Dozens of sample rows come from domains such as danefkdh.firebaseapp.com,
    nakupzlatadbrv.firebaseapp.com, valutadnxu.web.app, akozbohatnutszbg.firebaseapp.com,
    hurmanblirrik*.web.app, kopavguld*.web.app, forsaljningavaktier*.web.app, investeringar*.firebaseapp.com,
    etc. Their snippets jump between unrelated topics mid-document (e.g. antique-buying
    then a date-stamped fragment then a Bitcoin price chart) and frequently mix Czech
    and Slovak within the same passage. Counter-evidence: not every *.firebaseapp.com/*.web.app
    page is spam (a few, like shop.loxone.com''s parent pattern, are absent from this
    class), and some legitimate small businesses do use Firebase hosting.'
  prevalence: 0.053207833540771944
  prevalence_ci95:
  - 0.05312239361012374
  - 0.05329340315523455
  n_matched: 1408437
  evaluated_on: meta
  exact_on_full_corpus: true
  agent_expected_precision: 0.75
  likely_false_positives: A minority of *.firebaseapp.com/*.web.app hosts may be legitimate
    small apps or personal sites with genuine coherent Slovak content rather than
    templated content-farm doorway pages; the domain-suffix selector alone cannot
    separate those from the templated-spam majority.
