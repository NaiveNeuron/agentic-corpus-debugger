  - 0.009414240979825756
  n_matched: 18887
  evaluated_on: corpus
  exact_on_full_corpus: false
  agent_expected_precision: null
  likely_false_positives: A document genuinely discussing text advertising, or a media-industry
    article quoting the phrase.
