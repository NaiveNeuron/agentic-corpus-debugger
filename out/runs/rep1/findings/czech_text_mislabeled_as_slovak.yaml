id: czech_text_mislabeled_as_slovak
scope: slk_Latn
description: A systematic slice of documents are substantially or entirely Czech-language
  text (product data, forum posts, cookie notices, thesis metadata, Pinterest boards)
  that the corpus nonetheless labels as Slovak (slk_Latn). These typically come from
  bilingual CZ/SK commerce platforms, cross-posted forums, and Pinterest country mirrors
  that reuse Czech copy on .sk domains or vice versa.
selector: fasttext='cs' AND langdetect='cs' AND lingua_top='cs' AND NOT (domain LIKE
  '%.firebaseapp.com' OR domain LIKE '%.web.app')
assertion: Documents where independent language identifiers unanimously disagree with
  the corpus's Slovak label and agree on Czech should be re-examined and either relabeled
  or removed from a Slovak-only resource.
evidence:
  agent_evidence: '44,251 of 26,470,482 documents (0.17%) have all three independent
    language identifiers (fasttext, langdetect, lingua) agreeing on Czech while the
    pipeline''s own label is Slovak. domain_stats shows this concentrated in identifiable
    domain classes: Pinterest country mirrors (cz.pinterest.com 9.9% of its own docs,
    sk.pinterest.com 2.7%), CZ/SK shared e-commerce catalogs (latky-marlen.sk 39%,
    tenisove-zbozi.cz 51%, sracky.1984.cz 76% -- though the last is actually a nonsense/profanity
    generator, a separate issue), bilingual parenting/forum sites (modrykonik.sk/.cz),
    and a Czech thesis repository (dspace.vutbr.cz, 8.7%, though many of these have
    genuinely Slovak abstracts with only Czech/English metadata labels -- a partial
    false positive). I inspected 15+15 sampled documents (evaluate_detector seed=9
    n=15 and sample_documents seed=3/4): the large majority (~13/15, ~87%) were dominantly
    or entirely Czech running text (e.g. latky-marlen.sk fabric descriptions in Czech,
    mandarinka.cz jewelry descriptions in Czech, arome.cz classified ad, audiozone.cz
    forum reply) with at most a Slovak sentence or two; a minority were genuinely
    bilingual forum threads (modrykonik) where Slovak and Czech speakers converse
    in their own language on the same page. I also checked fasttext=''cs'' alone (without
    langdetect/lingua agreement): that weaker condition was much noisier, catching
    many genuinely Slovak pages that fasttext misclassifies on short/quote-heavy text
    (forum.zdravie.sk, zlavoking.sk, new.rcsolosnica.sk all pure Slovak) -- so I did
    not use it.'
  prevalence: 0.0012011492650568281
  prevalence_ci95:
  - 0.0011880263579465444
  - 0.0012144169511996126
  n_matched: 31795
  evaluated_on: corpus_meta
  exact_on_full_corpus: true
  agent_expected_precision: 0.8
  likely_false_positives: Genuinely bilingual CZ/SK forum threads where the majority
    language present may still be Slovak in aggregate across the page; Slovak academic
    abstracts hosted on Czech institutional repositories (dspace.vutbr.cz) where only
    template/metadata fields are Czech but the abstract body is authentic Slovak.
